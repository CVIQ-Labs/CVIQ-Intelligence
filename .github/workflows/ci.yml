name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          python -c "from spacy.cli import download; download('en_core_web_sm')"

      - name: Run tests
        run: pytest backend/tests/ -v
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run Bandit security scan
        run: |
          pip install bandit
          bandit -r backend/app -ll

      - name: Run pip-audit vulnerability scan
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --progress-spinner off || true

      - name: Build Docker image
        run: docker build -t cv-reviewer:${{ github.sha }} ./backend

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cv-reviewer:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  deploy-staging-backend:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    steps:
      - name: Deploy to Oracle VM (staging)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 130.162.237.24
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          script: |
            if [ ! -d ~/Resume-Review-Engine ]; then git clone https://github.com/CVIQ-Labs/CVIQ-Intelligence.git ~/Resume-Review-Engine; fi
            cd ~/Resume-Review-Engine && git fetch origin && git reset --hard origin/staging
            cd backend && docker build -t cv-reviewer-staging .
            docker stop cv-reviewer-staging || true
            docker rm cv-reviewer-staging || true
            docker run -d --name cv-reviewer-staging --restart unless-stopped \
              -p 8001:8000 \
              -v /app/data/chroma-staging:/app/data/chroma \
              --env-file ~/app-staging.env \
              cv-reviewer-staging

      - name: Smoke test staging
        run: |
          for i in $(seq 1 18); do
            STATUS=$(curl -s --connect-timeout 5 -m 10 -o /dev/null -w "%{http_code}" https://staging.api.getcviq.com/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Staging health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/18: got HTTP $STATUS - retrying in 10s"
            sleep 10
          done
          echo "Staging smoke test failed"
          exit 1

  deploy-staging-frontend:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Vercel (staging preview)
        run: npx vercel --cwd frontend --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-backend:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 130.162.237.24
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          script: |
            if [ ! -d ~/Resume-Review-Engine ]; then git clone https://github.com/CVIQ-Labs/CVIQ-Intelligence.git ~/Resume-Review-Engine; fi
            cd ~/Resume-Review-Engine && git fetch origin && git reset --hard origin/main
            cd backend && docker build -t cv-reviewer .
            docker stop cv-reviewer cviq-api || true
            docker rm cv-reviewer cviq-api || true
            docker run -d --name cv-reviewer --restart unless-stopped \
              --network=host \
              -v /app/data/chroma:/app/data/chroma \
              --env-file ~/app.env \
              cv-reviewer

      - name: Smoke test
        run: |
          for i in $(seq 1 18); do
            STATUS=$(curl -s --connect-timeout 5 -m 10 -o /dev/null -w "%{http_code}" https://api.getcviq.com/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/18: got HTTP $STATUS - retrying in 10s"
            sleep 10
          done
          echo "Smoke test failed: /health did not return 200 within 3 minutes"
          exit 1

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Vercel (production)
        working-directory: frontend
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
